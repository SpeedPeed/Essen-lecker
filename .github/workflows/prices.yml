name: Preise aktualisieren
on:
  schedule:
    - cron: '17 5 * * *' # täglich ~06:17 Wiener Zeit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/prices.js
      - run: node test.js
      - name: Commit, falls sich Preise geändert haben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Preise aktualisiert ($(date -u +%F))" && git push)
