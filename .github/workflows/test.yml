name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.js
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tests/e2e.js
